name: Publish npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'rinaldo-rex/pi-ask-better'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          if (pkg.name !== "pi-ask-better") {
            throw new Error("Only pi-ask-better may be published by this workflow.");
          }
          if (pkg.repository?.url !== "git+https://github.com/rinaldo-rex/pi-ask-better.git") {
            throw new Error("Package repository must point to this fork.");
          }
          if (!/^\d+\.\d+\.\d+$/.test(pkg.version) || process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error("Tag must exactly match the stable package.json version.");
          }
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome CI
        run: pnpm check:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Inspect package contents
        run: npm pack --dry-run --ignore-scripts

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js without dependency caching or static credentials
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.18.0 --ignore-scripts

      - name: Publish through npm OIDC
        run: npm publish --access public --provenance --ignore-scripts --registry https://registry.npmjs.org
